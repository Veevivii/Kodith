<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kodith — admin — CCE applications</title>
<meta name="robots" content="noindex, nofollow">

<!-- Root-relative, not relative: this page is served at /admin/cards with no
     trailing slash, so relative paths would resolve against /admin/ (or /). -->
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="admin-body">

<!-- ========================= LOGIN =========================
     Same markup and same shared auth flow as /admin — this page is gated by
     exactly the same session, and every endpoint it calls is behind
     requireAuth() server-side. -->
<main class="admin-login" id="loginScreen" hidden>
  <form class="admin-login__card" id="loginForm">
    <p class="admin-login__mark">Kodith</p>
    <p class="eyebrow">Admin</p>

    <label class="admin-field">
      <span>Email</span>
      <input type="email" name="email" autocomplete="username" required>
    </label>
    <label class="admin-field">
      <span>Password</span>
      <input type="password" name="password" autocomplete="current-password" required>
    </label>

    <p class="admin-login__error" id="loginError" hidden></p>

    <button type="submit" class="btn btn--primary admin-login__submit">Log in</button>
  </form>
</main>

<!-- ========================= CARDS ========================= -->
<div id="dashboard" hidden>
  <header class="admin-bar">
    <p class="admin-bar__mark">Kodith <span>admin</span></p>
    <nav class="admin-nav" aria-label="Admin sections">
      <a href="/admin">Content</a>
      <a href="/admin/cards">Cards</a>
      <a href="/admin/cce" class="is-current" aria-current="page">CCE</a>
    </nav>
    <div class="admin-bar__who">
      <span id="whoami"></span>
      <button type="button" class="admin-bar__logout" id="logoutBtn">Log out</button>
    </div>
  </header>

  <main class="admin-main admin-main--wide">
    <section class="admin-panel" aria-labelledby="h-cce">
      <div class="admin-panel__head">
        <h2 id="h-cce">CCE applications</h2>
        <a class="admin-panel__link" href="/cce" target="_blank" rel="noopener noreferrer">View the public form</a>
      </div>
      <!-- Applicants' personal details: rendered only from this session-gated page,
           always as text (never HTML), since the content comes from the public form. -->
      <div class="cce-filters" id="filters" role="group" aria-label="Filter by status"></div>
      <div id="apps"></div>
    </section>
  </main>
</div>

<div class="admin-toast" id="toast" hidden></div>

<script src="/admin/admin-shared.js" defer></script>
<script src="/admin/cce/cce.js" defer></script>
</body>
</html>
